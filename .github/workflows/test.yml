name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Exact Solar build CI expects. `--use solar` runs whatever `solar` is on PATH (the one in the
  # Foundry tarball installed below), and its version is embedded in the bytecode (CBOR `solar` key)
  # and in the metadata Sourcify verifies against. Bump together with the Foundry version.
  SOLAR_VERSION: 0.8.38+commit.a2b44354.solar.0.3.0-dev
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: solc
            use: ""
          - compiler: solar
            use: "--use solar"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          # v1.9.0 release tarballs ship the `solar` binary that `--use solar` resolves on PATH.
          version: v1.9.0

      - name: Show Forge version
        run: forge --version

      - name: Show Solar version
        if: matrix.compiler == 'solar'
        run: solar --version

      - name: Run Forge fmt
        if: matrix.compiler == 'solc'
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes ${{ matrix.use }}

      - name: Check Solar build
        if: matrix.compiler == 'solar'
        run: |
          versions=$(find out -name '*.json' -not -path 'out/build-info/*' \
            -exec jq -r '.metadata.compiler.version // empty' {} + | sort -u)
          echo "$versions"
          test "$versions" = "$SOLAR_VERSION"

      - name: Run Forge tests
        run: forge test -vvv ${{ matrix.use }}
